name: Nightly Wheel Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-wheels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_wheels:
    name: Build and test Python ${{ matrix.python-version }} wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++-13 lld pkg-config libssl-dev protobuf-compiler
          python -m pip install --upgrade pip packaging

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build wheel
        id: build
        run: |
          set -o pipefail
          mkdir -p tmp
          python -m pip wheel . --no-deps --verbose --wheel-dir dist 2>&1 | tee tmp/wheel-build.log

      - name: Validate wheel
        id: wheel
        run: |
          wheel_path="$(python scripts/validate_wheel.py dist)"
          printf 'path=%s\n' "$wheel_path" >> "$GITHUB_OUTPUT"

      - name: Install wheel and test dependencies
        run: |
          python -m pip install '${{ steps.wheel.outputs.path }}' pytest pytest-asyncio numpy pylance mypy
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          subprocess.run([sys.executable, '-m', 'pip', 'install', *project['build-system']['requires']], check=True)
          PY

      - name: Test build tooling
        run: python -m pytest tests -q

      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c 'import pathlib, sys, sparse_embedding; assert pathlib.Path(sparse_embedding.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()), sparse_embedding.__file__; print(sparse_embedding.__file__)'
          # Keep pytest's package collection outside the source checkout.
          test_dir="$(mktemp -d "$RUNNER_TEMP/wheel-tests.XXXXXX")"
          cp "$GITHUB_WORKSPACE/sparse_embedding/tests/test_embedding_table.py" \
            "$GITHUB_WORKSPACE/sparse_embedding/tests/test_checkpoint.py" "$test_dir/"
          python -I -m pytest --import-mode=importlib \
            -c "$GITHUB_WORKSPACE/pyproject.toml" "$test_dir"
          python -I -m mypy --no-incremental --follow-imports=silent \
            --cache-dir "$RUNNER_TEMP/mypy-cache" \
            "$GITHUB_WORKSPACE/tests/typing/native_checkpoint.py"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python-version }}
          path: ${{ steps.wheel.outputs.path }}
          if-no-files-found: error

      - name: Upload build log
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.python-version }}
          path: tmp/wheel-build.log
          if-no-files-found: error

  release:
    needs: build_wheels
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Update Nightly Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          gh release list --json tagName --jq '.[].tagName' > tmp-releases.txt
          if grep -Fxq nightly tmp-releases.txt; then
            gh release edit nightly --title 'Nightly Build' --notes "Built from $GITHUB_SHA." --prerelease
            gh release upload nightly dist/*.whl --clobber
          else
            gh release create nightly dist/*.whl --title 'Nightly Build' --notes "Built from $GITHUB_SHA." --prerelease --verify-tag
          fi
