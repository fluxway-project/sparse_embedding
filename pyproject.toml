[build-system]
requires = ["setuptools>=61.0", "nanobind==2.12.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse_embedding"
description = "High-performance distributed sparse embedding table"
readme = "README.md"
dynamic = ["version", "requires-python"]
license = { text = "Apache-2.0" }
dependencies = [
    "msgpack>=1.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "jax>=0.4.26",
    "numpy>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "setuptools>=61.0",
]
analysis = ["duckdb>=1.5.6"]
# Optional at runtime for lance checkpoint backend
pylance = [
    "pylance>=0.11.0",
]
gravitino = [
    "boto3>=1.35.0",
    "pylance>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["sparse_embedding/tests", "tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
